<div class=" max-w-sm min-w-sm h-90 mx-auto border border-secondary-foreground/20 dark:bg-secondary-foreground mb-1 shadow-lg p-6 ">

    @if(order.deliveryId == null) {
        <div class="flex flex-col gap-5 items-center mt-5">

            <img src="https://cdn3d.iconscout.com/3d/premium/thumb/deliveryman-12196807-9948539.png" alt="delivery agent avatar" class="h-40 w-40 rounded-full object-cover opacity-25 ">
            <h2 class="w-10/12 text-center">Soon The Delivery Agent will be Assigned for your order</h2>
        </div>
    }@else {
        <div class="w-full">
            <div class="w-full flex justify-center ">

                <img src="https://cdn3d.iconscout.com/3d/premium/thumb/deliveryman-12196807-9948539.png" alt="delivery agent avatar" class="h-24 w-24 rounded-full object-cover outline-4 outline-primary ">
            </div>
            <div class="w-full text-center mt-4">
                <h1 class="text-2xl font-semibold">Hi, I am {{order.agentName}}</h1>
                <p class="text-sm font-thin">I am coming shortly to your address.</p>
            </div>
        </div>
        <div class=" mt-5">
            <div class="mx-auto flex justify-start items-center ">
                <button class="h-10 w-10 flex justify-center items-center rounded-2xl bg-primary/40 ">
                    <i class="pi pi-phone" ></i> 
                </button>
                <span class="ml-4">{{order.agentPhone}}</span>
            </div>

            <div class="mt-3 mx-auto flex justify-start items-center ">
                <button class="h-10 w-10 flex justify-center items-center rounded-2xl bg-primary/40 ">
                    <i class="pi pi-envelope" ></i> 
                </button>
                <span class="ml-4">Message me</span>
            </div>
        </div>
    }
</div>
