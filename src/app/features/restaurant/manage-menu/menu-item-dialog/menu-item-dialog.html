<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60" (click)="onClose()">
  
  <div class="relative w-full max-w-lg rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 p-6 shadow-lg" (click)="$event.stopPropagation()">
    
    <div class="mb-6 flex flex-col space-y-1.5 text-center sm:text-left">
      <h3 class="text-xl font-semibold leading-none tracking-tight text-gray-800 dark:text-gray-200">
        {{ isEditMode ? 'Edit Menu Item' : 'Add New Menu Item' }}
      </h3>
      <p class="text-sm text-gray-500 dark:text-gray-400">
        {{ isEditMode ? 'Update the details of your menu item.' : 'Fill in the details for the new menu item.' }}
      </p>
    </div>
    
    <form [formGroup]="menuForm" (ngSubmit)="onSave()" class="space-y-4">
      
      <div>
        <label for="name" class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300">Name</label>
        <input type="text" id="name" formControlName="name" required class="flex h-10 w-full rounded-md border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2 text-sm text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-green-500 dark:focus:ring-green-500">
      </div>
      
      <div>
        <label for="description" class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300">Description</label>
        <textarea id="description" formControlName="description" rows="3" class="flex min-h-[80px] w-full rounded-md border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2 text-sm text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-green-500 dark:focus:ring-green-500"></textarea>
      </div>
      
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label for="price" class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300">Price</label>
          <input type="number" id="price" formControlName="price" required min="0" step="0.01" class="flex h-10 w-full rounded-md border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2 text-sm text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-green-500 dark:focus:ring-green-500">
        </div>
        <div>
          <label for="image" class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300">Image URL</label>
          <input type="url" id="image" formControlName="imgUrl" class="flex h-10 w-full rounded-md border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2 text-sm text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-green-500 dark:focus:ring-green-500">
        </div>
      </div>
      
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label for="cuisineType" class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300">Cuisine Type</label>
          <input id="cuisineType" formControlName="cuisineType" class="flex h-10 w-full rounded-md border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2 text-sm text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-green-500 dark:focus:ring-green-500">
        </div>
        <div>
          <label for="size" class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300">Size</label>
          <select id="size" formControlName="size" class="flex h-10 w-full rounded-md border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2 text-sm text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-green-500 dark:focus:ring-green-500">
            <option value="small">Small</option>
            <option value="medium">Medium</option>
            <option value="large">Large</option>
            <option value="extraLarge">Extra Large</option>
          </select>
        </div>
      </div>
      
      <div class="grid grid-cols-3 items-center gap-4">
        <div>
          <label for="prepTime" class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300">Prep Time (min)</label>
          <input id="prepTime" type="number" formControlName="prepTime" min="1" class="flex h-10 w-full rounded-md border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2 text-sm text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-green-500 dark:focus:ring-green-500">
        </div>
        <div class="flex items-center gap-2 pt-6">
          <input id="available" type="checkbox" formControlName="isAvailable" class="h-4 w-4 rounded border-gray-300 dark:border-gray-600 text-green-600 focus:ring-green-500">
          <label for="available" class="text-sm text-gray-700 dark:text-gray-300">Available</label>
        </div>
        <div class="flex items-center gap-2 pt-6">
          <input id="veg" type="checkbox" formControlName="isVegetarian" class="h-4 w-4 rounded border-gray-300 dark:border-gray-600 text-green-600 focus:ring-green-500">
          <label for="veg" class="text-sm text-gray-700 dark:text-gray-300">Vegetarian</label>
        </div>
      </div>
      
      <div class="flex items-center justify-end space-x-2 pt-4">
        <button type="button" (click)="onClose()" class="inline-flex h-10 items-center justify-center whitespace-nowrap rounded-md px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-200 transition-colors hover:bg-gray-100 dark:hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-gray-300/60 dark:focus:ring-gray-600/60">
          Cancel
        </button>
        <button type="submit" [disabled]="menuForm.invalid" class="inline-flex h-10 items-center justify-center whitespace-nowrap rounded-md bg-green-500 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-green-400/50 disabled:pointer-events-none disabled:opacity-50">
          Save Changes
        </button>
      </div>
      
    </form>
  </div>
</div>
