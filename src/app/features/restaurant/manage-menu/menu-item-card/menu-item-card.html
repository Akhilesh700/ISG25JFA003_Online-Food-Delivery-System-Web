<div class="flex flex-col md:flex-row gap-4 md:gap-6 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 p-4 shadow-sm transition-transform duration-200 hover:-translate-y-0.5 hover:shadow-lg">
  
  <img
    [src]="item.imgUrl || 'assets/placeholder-image.png'"
    [alt]="item.name"
    class="h-40 w-full md:h-32 md:w-32 flex-shrink-0 rounded-md object-cover"
  />

  <div class="flex flex-grow flex-col">
    <div class="flex-grow">
      <h3 class="text-lg font-bold text-gray-800 dark:text-gray-200">{{ item.name }}</h3>
      <p class="mt-1 text-sm text-gray-600 dark:text-gray-400">{{ item.description }}</p>
    </div>
    <div class="mt-4 flex items-center justify-between">
      <p class="text-xl font-semibold text-gray-800 dark:text-gray-200">
        ₹ {{ item.price | number:'1.2-2' }}
      </p>
    </div>
  </div>
  
  <div class="flex flex-row md:flex-col justify-start gap-2 border-t border-gray-200 dark:border-gray-700 md:border-t-0 md:border-l pt-4 md:pt-0 md:pl-4 -mx-4 md:mx-0 px-4 md:px-0">
    <button (click)="$event.stopPropagation(); onEdit()" title="Edit Item" class="flex-1 md:flex-auto justify-center rounded-md p-2 text-yellow-600 dark:text-yellow-500 transition-colors hover:bg-yellow-100 dark:hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-yellow-400/40">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mx-auto"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>
    </button>
    <button (click)="$event.stopPropagation(); onDelete()" title="Delete Item" class="flex-1 md:flex-auto justify-center rounded-md p-2 text-red-600 dark:text-red-500 transition-colors hover:bg-red-100 dark:hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-red-400/40">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mx-auto"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
    </button>
  </div>
</div>
