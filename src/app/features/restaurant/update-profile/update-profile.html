<main class="p-6">
  <h2 class="text-2xl font-bold text-gray-800 dark:text-gray-200 mb-6">
    Update Profile
  </h2>

  <!-- Loading Overlay -->
  <div *ngIf="isLoading" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white dark:bg-gray-800 p-8 rounded-lg shadow-xl flex flex-col items-center">
      <svg class="animate-spin h-12 w-12 text-orange-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
      <p class="text-gray-700 dark:text-gray-200 font-medium">Loading profile data...</p>
    </div>
  </div>

  <div class="bg-white dark:bg-gray-800 p-8 rounded-xl border border-gray-200 dark:border-gray-700 max-w-lg mx-auto">
    
    <div class="flex flex-col items-center space-y-4 mb-8">
      <img src="./img/avatar/restaurant_profile.jpg" alt="Profile Photo" class="w-24 h-24 rounded-full object-cover">
      <input type="file" #fileInput hidden (change)="onFileSelected($event)">
      <button type="button" (click)="fileInput.click()" class="text-sm font-medium text-orange-600 dark:text-orange-400 hover:text-orange-500">
        Change Photo
      </button>
    </div>

    <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="space-y-6">
      
      <div>
        <label for="name" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Restaurant Name</label>
        <div class="mt-1">
          <input 
            type="text" 
            id="name" 
            formControlName="name"
            placeholder="Enter restaurant name"
            class="block w-full px-3 py-2 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-500 rounded-md shadow-sm focus:outline-none focus:ring-orange-500 focus:border-orange-500 sm:text-sm text-gray-900 dark:text-gray-200">
          <span *ngIf="profileForm.get('name')?.invalid && profileForm.get('name')?.touched" class="text-xs text-red-500 mt-1">Restaurant name is required</span>
        </div>
      </div>

      <div>
        <label for="phone" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Phone Number</label>
        <div class="mt-1">
          <input 
            type="tel" 
            id="phone" 
            formControlName="phone"
            placeholder="Enter 10-digit phone number"
            class="block w-full px-3 py-2 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-500 rounded-md shadow-sm focus:outline-none focus:ring-orange-500 focus:border-orange-500 sm:text-sm text-gray-900 dark:text-gray-200">
          <span *ngIf="profileForm.get('phone')?.invalid && profileForm.get('phone')?.touched" class="text-xs text-red-500 mt-1">Enter a valid 10-digit phone number</span>
        </div>
      </div>

      <div>
        <label for="address" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Address</label>
        <div class="mt-1">
          <textarea 
            id="address" 
            formControlName="address"
            rows="3"
            placeholder="Enter restaurant address"
            class="block w-full px-3 py-2 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-500 rounded-md shadow-sm focus:outline-none focus:ring-orange-500 focus:border-orange-500 sm:text-sm text-gray-900 dark:text-gray-200"></textarea>
          <span *ngIf="profileForm.get('address')?.invalid && profileForm.get('address')?.touched" class="text-xs text-red-500 mt-1">Address is required</span>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label for="openTime" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Opening Time</label>
          <div class="mt-1">
            <input 
              type="text" 
              id="openTime" 
              formControlName="openTime"
              placeholder="HH:mm:ss (e.g., 09:00:00)"
              pattern="^([0-1]?[0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$"
              class="block w-full px-3 py-2 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-500 rounded-md shadow-sm focus:outline-none focus:ring-orange-500 focus:border-orange-500 sm:text-sm text-gray-900 dark:text-gray-200">
            <span class="text-xs text-gray-400 mt-1 block"></span>
          </div>
        </div>

        <div>
          <label for="closeTime" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Closing Time</label>
          <div class="mt-1">
            <input 
              type="text" 
              id="closeTime" 
              formControlName="closeTime"
              placeholder="HH:mm:ss (e.g., 22:00:00)"
              pattern="^([0-1]?[0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$"
              class="block w-full px-3 py-2 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-500 rounded-md shadow-sm focus:outline-none focus:ring-orange-500 focus:border-orange-500 sm:text-sm text-gray-900 dark:text-gray-200">
            <span class="text-xs text-gray-400 mt-1 block"></span>
          </div>
        </div>
      </div>

      <div class="flex justify-end gap-4 pt-4">
        <button (click)="onCancel()" type="button" class="py-2 px-4 border border-gray-300 dark:border-gray-500 rounded-md shadow-sm text-sm font-medium text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-600 focus:outline-none">
          Cancel
        </button>
        <button 
          type="submit"
          [disabled]="!profileForm.valid || isSaving" 
          class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-orange-500 hover:bg-orange-600 focus:outline-none disabled:bg-gray-400 disabled:cursor-not-allowed">
          <span *ngIf="isSaving" class="mr-2">
            <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
          </span>
          {{ isSaving ? 'Saving...' : 'Save Changes' }}
        </button>
      </div>
    </form>
  </div>
</main>
